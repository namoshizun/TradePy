[project]
name = "tradepy"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baostock>=0.9.1,<1.0.0",
    "cachetools>=7.1.4,<8.0.0",
    "dotenv>=0.9.9,<1.0.0",
    "fastexcel>=0.20.2,<1.0.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1,<4.0.0",
    "pandera[polars]>=0.31.1,<0.40.0",
    "polars[pyarrow,pandas]>=1.41.1,<1.50.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "tushare>=1.4.29,<1.5.0",
    "typer>=0.26.2,<0.27.0",
]

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
addopts = "-v --cov=tradepy --cov-report=term"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradepy"]
