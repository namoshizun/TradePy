name: Run tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/namoshizun/tradepy:base
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize TradePy config
        run: |
          mkdir -p "${HOME}/.tradepy"
          cp examples/basic_config.yaml "${HOME}/.tradepy/config.yaml"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.cache/uv
            .venv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run pyright
        run: uv run pyright tradepy/strategy examples/ma_cross.py examples/value_small_cap.py

      - name: Run pytest
        run: uv run pytest --cov-report=xml

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
